groups:
  - name: costwatch
    rules:
      - alert: DailyCostAboveBaseline
        expr: aws_cost_latest_day_usd > aws_cost_baseline_usd * 1.5
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Latest daily AWS cost is more than 1.5x the baseline"
 
      - alert: HostHighCpu
        expr: 100 - (avg(rate(node_cpu_seconds_total{mode="idle"}[2m])) * 100) > 85
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Host CPU above 85 percent"
